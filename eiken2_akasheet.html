<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検2級英単語 赤シート帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1A2130; --muted:#667085; --line:#E2E6ED;
  --red:#D62839; --red-deep:#A8172A; --chip:#E9ECF1; --ok:#1F8A5B; --okbg:#E6F4EC;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151B; --surface:#1B2029; --ink:#E8EBF0; --muted:#98A1B2; --line:#2B323E;
    --red:#E0394A; --red-deep:#B21F32; --chip:#262C37; --ok:#5CC896; --okbg:#1C3329;
  }
}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B2029; --ink:#E8EBF0; --muted:#98A1B2; --line:#2B323E;
  --red:#E0394A; --red-deep:#B21F32; --chip:#262C37; --ok:#5CC896; --okbg:#1C3329;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.sheet-mark{width:34px;height:34px;border-radius:9px;background:var(--red);position:relative;overflow:hidden;flex:none}
.sheet-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%)}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.seg button[data-mode="none"][aria-pressed="true"]{background:var(--ink);color:var(--surface)}

main{max-width:760px;margin:0 auto;padding:16px 16px 48px}

/* range chips + tools */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{border:0;background:var(--chip);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.tool{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tool svg{width:15px;height:15px}

.status{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 2px 10px;font-size:13px;color:var(--muted)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.card.known{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.knownbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.knownbtn[aria-pressed="true"]{background:var(--okbg);border-color:transparent;color:var(--ok);font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{position:relative;min-height:52px;border-radius:10px;background:var(--bg);display:flex;align-items:center;padding:10px 12px}
.cell .en{font-family:var(--serif);font-weight:650;font-size:19px;line-height:1.25;word-break:break-word}
.cell .jp{font-size:15px;font-weight:500;line-height:1.45}
.speak{margin-left:auto;border:0;background:transparent;color:var(--muted);padding:4px;border-radius:6px;flex:none;display:inline-flex}
.speak svg{width:18px;height:18px}

.mask{position:absolute;inset:0;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 0 var(--red-deep)}
.mask::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 62%);pointer-events:none}
.mask:active{filter:brightness(.92)}
.rehide{cursor:pointer}

.ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:6px;font-size:14px}
.exline{position:relative;border-radius:6px;padding:1px 0}
.exline.en{font-family:var(--serif);font-size:15px}
.exline.jp{color:var(--muted)}
.exline .mask{border-radius:6px;font-size:11px;box-shadow:none}
.exline.masked{min-height:1.6em;color:transparent}
.hide-ex .ex{display:none}

.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty button{margin-top:10px}

@media (max-width:560px){
  .top-in{padding:10px 12px}
  .seg{width:100%}
  .seg button{flex:1;padding:7px 6px}
  main{padding:12px 12px 40px}
  .cell .en{font-size:17px}
  .cell .jp{font-size:14px}
}
@media (prefers-reduced-motion: no-preference){
  .cell.flash{animation:flash .35s ease-out}
  @keyframes flash{from{background:color-mix(in srgb,var(--red) 18%,var(--bg))}to{background:var(--bg)}}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="sheet-mark" aria-hidden="true"></div>
      <div><h1>英検2級英単語 赤シート帳</h1><p>全1700語・例文つき</p></div>
    </div>
    <div class="seg" role="group" aria-label="隠す側">
      <button data-mode="en">英語を隠す</button>
      <button data-mode="jp">日本語を隠す</button>
      <button data-mode="none">全て表示</button>
    </div>
  </div>
</header>
<main>
  <section class="panel">
    <div class="chips" id="chips" role="group" aria-label="範囲"></div>
    <div class="tools">
      <button class="tool" id="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>シャッフル</button>
      <button class="tool" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>番号順に戻す</button>
      <button class="tool" id="toggleEx" aria-pressed="true">例文を表示</button>
      <button class="tool" id="toggleKnown" aria-pressed="false">覚えた語を除く</button>
    </div>
  </section>
  <div class="status"><span id="count"></span><span>赤いところをタップすると1つずつ確認できます</span></div>
  <div class="list" id="list"></div>
</main>

const STEP = 100;
const S = { mode:'en', range:'all', order:null, showEx:true, hideKnown:false, revealed:new Set(), known:new Set() };
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
S.known = new Set(store.get('akasheet-known',[]));
const prefs = store.get('akasheet-prefs',{});
if(prefs.mode) S.mode=prefs.mode;
if(typeof prefs.showEx==='boolean') S.showEx=prefs.showEx;
if(typeof prefs.hideKnown==='boolean') S.hideKnown=prefs.hideKnown;
if(prefs.range) S.range=prefs.range;
const savePrefs=()=>store.set('akasheet-prefs',{mode:S.mode,showEx:S.showEx,hideKnown:S.hideKnown,range:S.range});

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

// range chips
const ranges=[{key:'all',label:'すべて'}];
for(let s=1;s<=DATA.length;s+=STEP){ const e=Math.min(s+STEP-1,DATA.length); ranges.push({key:s+'-'+e,label:s+'–'+e,s,e}); }
$('chips').innerHTML = ranges.map(r=>`<button class="chip" data-range="${r.key}">${r.label}</button>`).join('');

function baseList(){
  const r = ranges.find(x=>x.key===S.range) || ranges[0];
  let items = r.key==='all' ? DATA : DATA.filter(d=>d[0]>=r.s && d[0]<=r.e);
  return items;
}
function currentList(){
  let items = baseList();
  if(S.order){ const pos=new Map(S.order.map((n,i)=>[n,i])); items=[...items].sort((a,b)=>(pos.get(a[0])??0)-(pos.get(b[0])??0)); }
  if(S.hideKnown) items = items.filter(d=>!S.known.has(d[0]));
  return items;
}

const speakIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const canSpeak = 'speechSynthesis' in window;

function cardHTML(d){
  const [n,en,jp,ex,exj]=d;
  const open = S.revealed.has(n);
  const hideEn = S.mode==='en' && !open, hideJp = S.mode==='jp' && !open;
  const canRehide = S.mode!=='none' && open;
  const maskBtn = `<button class="mask" data-reveal="${n}" aria-label="タップで確認">タップで確認</button>`;
  const enCell = `<div class="cell${canRehide&&S.mode==='en'?' rehide flash':''}" ${canRehide&&S.mode==='en'?`data-hide="${n}" title="タップで隠す"`:''}>
      <span class="en" lang="en">${esc(en)}</span>
      ${canSpeak && !hideEn?`<button class="speak" data-speak="${n}" aria-label="発音を聞く">${speakIcon}</button>`:''}
      ${hideEn?maskBtn:''}</div>`;
  const jpCell = `<div class="cell${canRehide&&S.mode==='jp'?' rehide flash':''}" ${canRehide&&S.mode==='jp'?`data-hide="${n}" title="タップで隠す"`:''}>
      <span class="jp">${esc(jp)}</span>${hideJp?maskBtn:''}</div>`;
  const exHTML = ex ? `<div class="ex">
      <div class="exline en${hideEn?' masked':''}" lang="en">${esc(ex)}${hideEn?`<button class="mask" data-reveal="${n}" aria-label="例文を確認"></button>`:''}</div>
      <div class="exline jp${hideJp?' masked':''}">${esc(exj)}${hideJp?`<button class="mask" data-reveal="${n}" aria-label="例文の訳を確認"></button>`:''}</div>
    </div>` : '';
  const k = S.known.has(n);
  return `<article class="card${k?' known':''}" id="c${n}">
    <div class="meta"><span>#${n}</span><button class="knownbtn" data-known="${n}" aria-pressed="${k}">${k?'✓ 覚えた':'覚えた'}</button></div>
    <div class="pair">${enCell}${jpCell}</div>${exHTML}</article>`;
}

function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.range===S.range));
  $('toggleEx').setAttribute('aria-pressed',S.showEx);
  $('toggleKnown').setAttribute('aria-pressed',S.hideKnown);
  document.body.classList.toggle('hide-ex',!S.showEx);
  const base=baseList(), items=currentList();
  const knownInRange = base.filter(d=>S.known.has(d[0])).length;
  $('count').innerHTML = `全 <b>${base.length}</b> 語中 <b>${items.length}</b> 語表示 ・ 覚えた <b>${knownInRange}</b> 語`;
  $('list').innerHTML = items.length ? items.map(cardHTML).join('') :
    `<div class="empty">この範囲の単語はすべて「覚えた」になっています。<br><button class="tool" id="showAllKnown">覚えた語も表示する</button></div>`;
}
function rerenderCard(n){
  const el=$('c'+n); const d=DATA.find(x=>x[0]===n);
  if(el&&d){ el.outerHTML=cardHTML(d); }
}

document.querySelector('.seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  S.mode=b.dataset.mode; S.revealed.clear(); savePrefs(); render();
});
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  S.range=b.dataset.range; S.order=null; S.revealed.clear(); savePrefs(); render();
  window.scrollTo({top:0});
});
$('shuffle').addEventListener('click',()=>{
  const ns=baseList().map(d=>d[0]);
  for(let i=ns.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ns[i],ns[j]]=[ns[j],ns[i]]; }
  S.order=ns; S.revealed.clear(); render();
});
$('reset').addEventListener('click',()=>{ S.order=null; S.revealed.clear(); render(); });
$('toggleEx').addEventListener('click',()=>{ S.showEx=!S.showEx; savePrefs(); render(); });
$('toggleKnown').addEventListener('click',()=>{ S.hideKnown=!S.hideKnown; savePrefs(); render(); });

$('list').addEventListener('click',e=>{
  const t=e.target;
  const sp=t.closest('[data-speak]');
  if(sp){ e.stopPropagation(); const d=DATA.find(x=>x[0]===+sp.dataset.speak);
    const txt=d[1].replace(/[~〜]|\(.*?\)|（.*?）|\[.*?\]/g,' ').replace(/\s+/g,' ').trim();
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u); return; }
  const rv=t.closest('[data-reveal]');
  if(rv){ const n=+rv.dataset.reveal; S.revealed.add(n); rerenderCard(n); return; }
  const kn=t.closest('[data-known]');
  if(kn){ const n=+kn.dataset.known;
    S.known.has(n)?S.known.delete(n):S.known.add(n); store.set('akasheet-known',[...S.known]);
    if(S.hideKnown && S.known.has(n)){ const el=$('c'+n); if(el) el.remove(); const base=baseList();
      $('count').innerHTML = `全 <b>${base.length}</b> 語中 <b>${currentList().length}</b> 語表示 ・ 覚えた <b>${base.filter(d=>S.known.has(d[0])).length}</b> 語`;
      if(!currentList().length) render();
    } else { rerenderCard(n); const base=baseList();
      $('count').innerHTML = `全 <b>${base.length}</b> 語中 <b>${currentList().length}</b> 語表示 ・ 覚えた <b>${base.filter(d=>S.known.has(d[0])).length}</b> 語`; }
    return; }
  const hd=t.closest('[data-hide]');
  if(hd){ const n=+hd.dataset.hide; S.revealed.delete(n); rerenderCard(n); return; }
  if(t.id==='showAllKnown'){ S.hideKnown=false; savePrefs(); render(); }
});
render();
</script>
</body>
</html>
